# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: bsx.hrx.hrx2026
type: application
server:
  customMiddleware:
    # /hrx: the HRX CAP service. With HRX_TOKEN set (a bearer token for the deployed
    # service) requests are proxied to it; otherwise mock/hrx-mock-middleware.js answers
    # from an in-memory copy with the same entities, functions and actions.
    - name: hrx-service
      afterMiddleware: compression
      configuration:
        mountPath: /hrx
        serviceUrl: https://bsx-tdd-tdd-bsx-hrx-srv.cfapps.eu10.hana.ondemand.com
    - name: fiori-tools-proxy
      afterMiddleware: hrx-service
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: hrx-service
middleware:
  path: mock/hrx-mock-middleware.js
