# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# The /hrx middleware, as a UI5 tooling extension of its own so the app's ui5*.yaml
# files stay single YAML documents (SAP Fiori tools reads them that way).
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: hrx-service
middleware:
  path: hrx-mock-middleware.js
